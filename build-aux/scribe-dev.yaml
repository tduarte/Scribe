# Development manifest. Builds the working tree straight from disk, so an edit
# is one `flatpak-builder --install` away.
#
# The manifest that goes to Flathub is io.github.tduarte.Scribe.yaml -- it has
# to carry that exact name to satisfy flatpak-builder-lint, so this one is
# named for its job instead.
# It differs ONLY in the last modules: it takes its source from a tagged git
# commit rather than this directory, and it does not ship the portal spikes.
# finish-args and cleanup are identical in both and must stay that way. To
# check after editing either one:
#
#   for f in build-aux/io.github.tduarte.Scribe*.yaml; do
#     sed -n '/^finish-args:/,/^modules:/p' "$f" | md5sum; done   # both hashes equal
app-id: io.github.tduarte.Scribe
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: scribe

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU: Vulkan compute for whisper.cpp, and GTK4 rendering.
  - --device=dri
  # Microphone. Flatpak has no capture-only audio permission and no microphone
  # portal exists, so this is the only available mechanism.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
  # Downloading speech models on first run.
  - --share=network
  #
  # Deliberately absent:
  #   --device=all      would be needed for ydotool/uinput; rejected by
  #                     flatpak-builder-lint and unnecessary given the
  #                     RemoteDesktop portal.
  #   --filesystem=*    models live in the app's own data directory.
  #   --talk-name=...   every portal is reachable from any sandbox by default.

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
  # Console scripts from numpy, requests, tqdm and pywhispercpp's own demo
  # entry points. Only /app/bin/scribe belongs on a user's PATH.
  - /bin/f2py
  - /bin/idna
  - /bin/normalizer
  - /bin/numpy-config
  - /bin/tqdm
  - /bin/pwcpp
  - /bin/pwcpp-*

modules:
  - spirv-headers.yaml
  # numpy, requests, tqdm, platformdirs -- pywhispercpp's install_requires.
  - python3-deps.yaml
  - pywhispercpp.yaml
  - silero-vad-model.yaml

  # The portal spikes, installed alongside the app so they exercise the real
  # modules rather than a copy. See docs/PORTAL-FINDINGS.md. Development only --
  # they are not part of the Flathub build.
  - name: scribe-spikes
    buildsystem: simple
    build-commands:
      - install -Dm755 spikes/spike_shortcuts.py /app/bin/spike-shortcuts
      - install -Dm755 spikes/spike_inject.py    /app/bin/spike-inject
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - .git
          - .venv
          - build
          - build-dir
          - build-spike
          - repo

  - name: scribe
    buildsystem: meson
    config-opts:
      - -Dbuildtype=release
    sources:
      - type: dir
        path: ..
        skip:
          - .flatpak-builder
          - .git
          - .venv
          - build
          - build-dir
          - build-spike
          - repo
